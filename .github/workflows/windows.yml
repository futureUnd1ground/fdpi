name: windows

on:
  push:
    tags:
      - "v*windows*"
      - "v*win*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Установить mingw-w64 кросс-тулчейн
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip

      - name: Собрать движок winws2.exe
        run: ./scripts/build-engine-windows.sh

      - name: Проверка Go-кода
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...

      - name: Собрать fdpi.exe и дистрибутив
        run: make dist-windows

      - name: Отладочные артефакты в CI
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fdpi-windows-amd64
          path: build/fdpi-windows-amd64.zip

      - name: Создать релиз
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/fdpi-windows-amd64.zip \
            --title "${{ github.ref_name }} — Windows" \
            --generate-notes
