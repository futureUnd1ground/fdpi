name: FDPI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install engine build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libnetfilter-queue-dev libnfnetlink-dev libmnl-dev zlib1g-dev liblua5.4-dev libcap-dev
      - name: Build pinned external nfqws2
        run: make engine
      - name: Vet, tests, race detector and actual engine dry-run
        run: FDPI_TEST_ENGINE="$PWD/build/nfqws2" make check build
